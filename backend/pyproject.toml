[project]
name = "piezofea"
version = "0.1.0"
description = "Web front end for openCFS piezoelectric simulation"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2",
    "gmsh",
    "numpy",
    "scipy",
    "h5py",
    "lxml",
    "scikit-rf",
]

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["slow: runs openCFS end to end"]
